# .github/workflows/react-cd.yml

name: Frontend CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - 'app-crud/**'           # Triggers only when app-crud files change
      - '.github/workflows/react-cd.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./app-crud

    - name: Build frontend
      run: npm run build
      working-directory: ./app-crud

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3 # Reverted to a highly stable v3 variant for Pages asset packaging
      with:
        # CRITICAL: Ensure this matches your project's output folder!
        # Use './app-crud/dist' for Vite, or './app-crud/build' for Create React App
        path: './app-crud/dist' 

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
